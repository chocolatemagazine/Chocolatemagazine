<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>The Wednesday Weekly 🌟</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Fraunces:ital,wght@0,700;0,900;1,700;1,900&family=DM+Sans:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --y:#FFD600;--o:#FF6B00;--r:#FF2D55;--g:#00C896;
  --b:#0099FF;--pk:#FF3CAC;--pu:#7C3AED;
  --ink:#111;--white:#fff;--off:#FFFDF7;--muted:#777;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:'DM Sans',sans-serif;background:var(--off);color:var(--ink);overflow-x:hidden;cursor:none;}
#cur{position:fixed;width:13px;height:13px;border-radius:50%;background:var(--y);pointer-events:none;z-index:9999;transform:translate(-50%,-50%);mix-blend-mode:multiply;transition:transform .1s,background .15s;}
#cur.big{transform:translate(-50%,-50%) scale(3.5);background:var(--pk);}
#prog{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--y),var(--o),var(--r),var(--pk));z-index:9000;width:0%;transition:width .08s linear;}
#nav{position:fixed;top:3px;left:0;right:0;z-index:8000;background:rgba(17,17,17,.94);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,214,0,.15);}
.nav-inner{max-width:780px;margin:0 auto;padding:.55rem 1.4rem;display:flex;align-items:center;justify-content:space-between;}
.nav-logo{font-family:'Bebas Neue',sans-serif;font-size:1.1rem;letter-spacing:.06em;color:var(--y);}
.nav-links{display:flex;gap:1.1rem;}
.nav-links a{font-family:'Space Mono',monospace;font-size:.56rem;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.5);text-decoration:none;transition:color .18s;}
.nav-links a:hover{color:var(--y);}
#btt{position:fixed;bottom:1.8rem;right:1.5rem;background:var(--y);color:var(--ink);border:none;border-radius:50%;width:40px;height:40px;font-size:.9rem;font-weight:700;cursor:pointer;z-index:8000;box-shadow:0 4px 18px rgba(255,214,0,.35);opacity:0;transform:translateY(12px);transition:opacity .3s,transform .3s;}
#btt.show{opacity:1;transform:translateY(0);}
.mag{max-width:780px;margin:0 auto;padding:0 1.2rem;}
.sec-div{height:3px;background:linear-gradient(90deg,transparent,var(--y),var(--o),transparent);margin:0 -1.2rem;opacity:.4;}
.cover{background:var(--ink);min-height:88vh;display:flex;flex-direction:column;justify-content:flex-end;padding:2.4rem 2.2rem 3rem;position:relative;overflow:hidden;margin:0 -1.2rem;}
.cover-orb{position:absolute;border-radius:50%;pointer-events:none;filter:blur(70px);}
.cover-orb1{width:380px;height:380px;background:#FF6B0033;top:-80px;right:-60px;}
.cover-orb2{width:260px;height:260px;background:#FFD60022;bottom:40px;left:-40px;}
.cover-orb3{width:200px;height:200px;background:#FF3CAC18;top:35%;left:38%;}
.cover-series{display:inline-flex;align-items:center;gap:.5rem;background:var(--y);color:var(--ink);border-radius:999px;padding:.28rem .9rem;font-family:'Space Mono',monospace;font-size:.58rem;font-weight:700;letter-spacing:.1em;margin-bottom:1.1rem;width:fit-content;}
.cover-issue{font-family:'Space Mono',monospace;font-size:.58rem;letter-spacing:.18em;color:rgba(255,255,255,.35);text-transform:uppercase;margin-bottom:.5rem;}
.cover-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(3.8rem,13vw,6.5rem);line-height:.88;color:var(--white);letter-spacing:.02em;}
.cover-title span{color:var(--y);}
.cover-sub{margin-top:.9rem;font-size:.9rem;color:rgba(255,255,255,.55);max-width:360px;line-height:1.6;font-style:italic;}
.cover-meta{display:flex;flex-wrap:wrap;gap:1rem;margin-top:1.8rem;font-family:'Space Mono',monospace;font-size:.62rem;color:rgba(255,255,255,.38);letter-spacing:.06em;}
.cover-scroll{position:absolute;right:2rem;bottom:2rem;color:rgba(255,255,255,.3);font-family:'Space Mono',monospace;font-size:.58rem;letter-spacing:.16em;text-transform:uppercase;writing-mode:vertical-rl;display:flex;align-items:center;gap:.5rem;animation:float 2.5s ease-in-out infinite;}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(8px);}}
.ticker-wrap{background:var(--ink);overflow:hidden;padding:.42rem 0;margin:0 -1.2rem;}
.ticker-inner{display:flex;animation:tick 35s linear infinite;white-space:nowrap;}
.ticker-inner span{font-family:'Space Mono',monospace;font-size:.62rem;color:var(--y);padding:0 2.2rem;}
@keyframes tick{from{transform:translateX(0);}to{transform:translateX(-50%);}}
.sec-header{padding:2.2rem 0 1.2rem;}
.sec-kicker{font-family:'Space Mono',monospace;font-size:.58rem;letter-spacing:.2em;text-transform:uppercase;margin-bottom:.4rem;}
.sec-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(1.8rem,6vw,2.6rem);letter-spacing:.03em;line-height:1;}
.sec-sub{font-size:.82rem;margin-top:.4rem;font-style:italic;opacity:.55;max-width:380px;line-height:1.5;}
.news-grid{display:flex;flex-direction:column;gap:.85rem;padding-bottom:2.5rem;}
.nc{background:var(--white);border-radius:16px;padding:1.1rem 1.2rem 1.1rem 1.4rem;border:1.5px solid #EBEBEB;transition:transform .2s,box-shadow .2s;position:relative;overflow:hidden;}
.nc:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(0,0,0,.08);}
.nc-bar{position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:4px 0 0 4px;}
.nc-top{display:flex;align-items:center;gap:.5rem;margin-bottom:.45rem;}
.nc-cat{font-family:'Space Mono',monospace;font-size:.53rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:.18rem .55rem;border-radius:999px;}
.nc-date{font-family:'Space Mono',monospace;font-size:.52rem;color:#bbb;margin-left:auto;}
.nc-headline{font-family:'Fraunces',serif;font-size:1rem;font-weight:700;color:var(--ink);line-height:1.28;margin-bottom:.4rem;}
.nc-brief{font-size:.79rem;line-height:1.62;color:var(--muted);}
.nc-link{display:inline-flex;align-items:center;gap:.3rem;margin-top:.6rem;font-family:'Space Mono',monospace;font-size:.58rem;font-weight:700;text-decoration:none;transition:gap .18s;}
.nc-link:hover{gap:.6rem;}
.sci-wrap{background:var(--white);border-radius:20px;border:1.5px solid #D4FFF2;overflow:hidden;margin-bottom:2.5rem;}
.sci-top-band{background:var(--g);padding:1.1rem 1.5rem;display:flex;align-items:center;justify-content:space-between;}
.sci-band-title{font-family:'Bebas Neue',sans-serif;font-size:1.1rem;color:#fff;letter-spacing:.05em;}
.sci-band-tag{font-family:'Space Mono',monospace;font-size:.55rem;color:rgba(255,255,255,.65);}
.sci-body{padding:1.4rem 1.5rem;}
.sci-kicker-inner{font-family:'Space Mono',monospace;font-size:.58rem;letter-spacing:.18em;color:var(--g);text-transform:uppercase;margin-bottom:.5rem;}
.sci-headline{font-family:'Fraunces',serif;font-size:clamp(1.4rem,4.5vw,1.9rem);font-weight:900;line-height:1.1;color:var(--ink);margin-bottom:.7rem;}
.sci-headline em{font-style:italic;color:var(--g);}
.sci-deck{font-size:.88rem;line-height:1.74;color:#333;border-left:4px solid var(--g);padding-left:1rem;margin-bottom:1.3rem;font-weight:500;}
.sci-h3{font-family:'Bebas Neue',sans-serif;font-size:1rem;letter-spacing:.05em;color:var(--g);margin-bottom:.4rem;margin-top:1.1rem;}
.sci-p{font-size:.83rem;line-height:1.75;color:#333;margin-bottom:.4rem;}
.sci-callout{background:var(--g);color:#fff;border-radius:13px;padding:1rem 1.15rem;margin:1rem 0;}
.sci-callout h4{font-family:'Bebas Neue',sans-serif;font-size:.9rem;letter-spacing:.05em;margin-bottom:.35rem;}
.sci-callout p{font-size:.79rem;line-height:1.6;opacity:.92;}
.sci-fact{display:flex;gap:.75rem;align-items:flex-start;background:#F0FFF8;border-radius:11px;padding:.82rem .95rem;margin-bottom:.6rem;border:1.5px solid #B2F5E0;}
.sci-fact-icon{font-size:1.2rem;flex-shrink:0;}
.sci-fact-txt{font-size:.79rem;line-height:1.56;color:#333;}
.sci-fact-txt strong{color:var(--g);}
.vocab-box{background:#F0FFF8;border-radius:13px;padding:1rem 1.15rem;margin-top:1rem;border:1.5px solid #B2F5E0;}
.vocab-box h4{font-family:'Bebas Neue',sans-serif;font-size:.88rem;color:var(--g);letter-spacing:.05em;margin-bottom:.6rem;}
.vocab-item{margin-bottom:.45rem;font-size:.78rem;color:#333;line-height:1.5;}
.vocab-item strong{color:var(--ink);}
.pers-wrap{background:linear-gradient(150deg,#FF3CAC,#784BA0,#2B86C5);border-radius:20px;overflow:hidden;margin-bottom:2.5rem;}
.pers-top{padding:1.1rem 1.5rem;background:rgba(0,0,0,.15);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:space-between;}
.pers-top-title{font-family:'Bebas Neue',sans-serif;font-size:1.1rem;color:#fff;letter-spacing:.05em;}
.pers-body{padding:1.4rem 1.5rem 1.8rem;}
.p-avatar{width:68px;height:68px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:2.1rem;margin-bottom:.9rem;border:3px solid rgba(255,255,255,.4);}
.p-name{font-family:'Fraunces',serif;font-size:1.8rem;font-weight:900;color:#fff;line-height:1.05;margin-bottom:.2rem;}
.p-title{font-family:'Space Mono',monospace;font-size:.58rem;color:rgba(255,255,255,.55);letter-spacing:.1em;margin-bottom:.9rem;}
.p-quote{font-family:'Fraunces',serif;font-style:italic;font-size:.95rem;line-height:1.58;color:#fff;background:rgba(255,255,255,.12);border-radius:12px;padding:.9rem 1rem;margin-bottom:1rem;}
.p-facts{display:grid;grid-template-columns:1fr 1fr;gap:.55rem;margin-bottom:.85rem;}
.pf{background:rgba(255,255,255,.12);border-radius:11px;padding:.65rem .85rem;}
.pf-lbl{font-family:'Space Mono',monospace;font-size:.5rem;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.45);margin-bottom:.18rem;}
.pf-val{font-size:.81rem;font-weight:600;color:#fff;}
.p-sec{background:rgba(255,255,255,.11);border-radius:12px;padding:.9rem 1rem;margin-bottom:.7rem;}
.p-sec h4{font-family:'Bebas Neue',sans-serif;font-size:.92rem;color:var(--y);letter-spacing:.05em;margin-bottom:.38rem;}
.p-sec p{font-size:.8rem;line-height:1.66;color:rgba(255,255,255,.88);}
.p-lesson{background:var(--y);border-radius:12px;padding:.9rem 1rem;margin-top:.7rem;}
.p-lesson h4{font-family:'Bebas Neue',sans-serif;font-size:.88rem;color:var(--ink);letter-spacing:.05em;margin-bottom:.3rem;}
.p-lesson p{font-size:.78rem;line-height:1.56;color:var(--ink);opacity:.8;}
.fun-wrap{margin-bottom:2.5rem;}
.fun-band{background:var(--o);padding:1.1rem 1.5rem;border-radius:16px 16px 0 0;display:flex;align-items:center;justify-content:space-between;}
.fun-band-title{font-family:'Bebas Neue',sans-serif;font-size:1.1rem;color:#fff;letter-spacing:.05em;}
.fun-body{background:var(--white);border-radius:0 0 16px 16px;border:1.5px solid #FFE0B2;border-top:none;padding:1.4rem 1.5rem;}
.sub-title{font-family:'Bebas Neue',sans-serif;font-size:1rem;letter-spacing:.05em;margin-bottom:.85rem;display:flex;align-items:center;gap:.6rem;}
.sub-title::after{content:'';flex:1;height:1.5px;background:currentColor;opacity:.15;}
.ff-list{display:flex;flex-direction:column;gap:.7rem;margin-bottom:1.6rem;}
.ff{display:flex;gap:.85rem;align-items:flex-start;background:#FFFBF0;border-radius:12px;padding:.9rem 1rem;border:1.5px solid #FFE0B2;transition:transform .2s;}
.ff:hover{transform:translateX(4px);}
.ff-num{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;color:var(--o);min-width:26px;line-height:1;}
.ff-txt{font-size:.8rem;line-height:1.62;color:#333;}
.ff-txt strong{color:var(--o);}
.recipe-box{background:#FFFBF0;border-radius:14px;padding:1.2rem 1.3rem;margin-bottom:1.6rem;border:1.5px solid #FFE0B2;}
.recipe-box h3{font-family:'Fraunces',serif;font-size:1.05rem;font-weight:700;color:var(--ink);margin-bottom:.2rem;}
.recipe-sub{font-size:.7rem;color:var(--muted);font-style:italic;margin-bottom:.9rem;}
.r-step{display:flex;gap:.7rem;align-items:flex-start;margin-bottom:.6rem;padding:.6rem .7rem;border-radius:9px;background:#fff;border:1.5px solid #FFE0B2;}
.r-n{background:var(--o);color:#fff;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-family:'Space Mono',monospace;font-size:.62rem;font-weight:700;flex-shrink:0;margin-top:.1rem;}
.r-t{font-size:.79rem;line-height:1.52;color:#333;}
.joke-box{background:var(--y);border-radius:14px;padding:1.2rem 1.3rem;text-align:center;}
.joke-box h3{font-family:'Bebas Neue',sans-serif;font-size:1rem;color:var(--ink);letter-spacing:.05em;margin-bottom:.75rem;}
.j-setup{font-size:.9rem;line-height:1.6;color:var(--ink);font-style:italic;min-height:42px;}
.j-punch{font-size:.84rem;color:var(--o);font-weight:700;margin-top:.5rem;display:none;}
.j-btn{margin-top:.85rem;background:var(--ink);color:var(--y);border:none;border-radius:999px;padding:.48rem 1.05rem;font-family:'Space Mono',monospace;font-size:.65rem;font-weight:700;cursor:pointer;transition:transform .15s;margin-right:.38rem;}
.j-btn:hover{transform:scale(1.06);}
.ent-wrap{margin-bottom:2.5rem;}
.ent-band{background:var(--pk);padding:1.1rem 1.5rem;border-radius:16px 16px 0 0;display:flex;align-items:center;justify-content:space-between;}
.ent-band-title{font-family:'Bebas Neue',sans-serif;font-size:1.1rem;color:#fff;letter-spacing:.05em;}
.ent-body{background:#0A0A0A;border-radius:0 0 16px 16px;padding:1.4rem 1.5rem;}
.ent-grid{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;}
.ec{border-radius:14px;padding:1rem;border:1.5px solid rgba(255,255,255,.07);transition:transform .2s;}
.ec:hover{transform:translateY(-3px);}
.ec0{background:linear-gradient(135deg,#1a0030,#3d0060);}
.ec1{background:linear-gradient(135deg,#001530,#003060);}
.ec2{background:linear-gradient(135deg,#1a1a00,#3d3a00);}
.ec3{background:linear-gradient(135deg,#200010,#500030);}
.ec-em{font-size:1.4rem;margin-bottom:.45rem;display:block;}
.ec-cat{font-family:'Space Mono',monospace;font-size:.5rem;letter-spacing:.12em;text-transform:uppercase;opacity:.4;color:#fff;margin-bottom:.22rem;}
.ec-title{font-family:'Fraunces',serif;font-size:.9rem;font-weight:700;color:#fff;line-height:1.2;margin-bottom:.28rem;}
.ec-body{font-size:.7rem;line-height:1.5;color:rgba(255,255,255,.6);}
.ec-tag{display:inline-block;margin-top:.4rem;background:rgba(255,255,255,.09);color:rgba(255,255,255,.6);border-radius:999px;padding:.14rem .5rem;font-size:.55rem;font-family:'Space Mono',monospace;}
.quiz-wrap{background:#111;border-radius:14px;padding:1.3rem;margin-top:1.2rem;border:1.5px solid rgba(255,60,172,.2);}
.quiz-wrap h3{font-family:'Bebas Neue',sans-serif;font-size:1rem;color:var(--pk);letter-spacing:.05em;margin-bottom:.3rem;}
.q-ctr{font-family:'Space Mono',monospace;font-size:.58rem;color:rgba(255,60,172,.6);margin-bottom:.5rem;}
.q-prog{height:3px;background:rgba(255,255,255,.07);border-radius:999px;margin-bottom:.9rem;overflow:hidden;}
.q-pbar{height:100%;background:linear-gradient(90deg,var(--pk),var(--y));border-radius:999px;transition:width .4s;}
.q-txt{font-size:.86rem;font-weight:600;color:#fff;margin-bottom:.75rem;line-height:1.45;}
.q-opts{display:flex;flex-direction:column;gap:.45rem;}
.qo{text-align:left;padding:.58rem .85rem;border-radius:10px;border:1.5px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);font-family:'DM Sans',sans-serif;font-size:.79rem;cursor:pointer;transition:all .18s;color:#ccc;}
.qo:hover:not(:disabled){border-color:var(--pk);background:rgba(255,60,172,.12);}
.qo.correct{border-color:var(--g);background:rgba(0,200,150,.12);color:var(--g);font-weight:700;}
.qo.wrong{border-color:var(--r);background:rgba(255,45,85,.1);color:#FF6B6B;}
.q-fb{margin-top:.6rem;font-size:.76rem;font-weight:600;min-height:16px;}
.q-next-btn{margin-top:.8rem;background:var(--pk);color:#fff;border:none;border-radius:999px;padding:.52rem 1.15rem;font-family:'Space Mono',monospace;font-size:.66rem;font-weight:700;cursor:pointer;display:none;transition:transform .15s;}
.q-next-btn:hover{transform:scale(1.04);}
.q-done{display:none;text-align:center;padding:.9rem 0;}
.q-score-big{font-family:'Bebas Neue',sans-serif;font-size:3.2rem;color:var(--y);}
.q-score-msg{color:#555;font-size:.85rem;margin-top:.35rem;}
.pl-wrap{background:#111;border-radius:14px;padding:1.2rem 1.3rem;margin-top:1.2rem;border:1.5px solid rgba(255,255,255,.07);}
.pl-wrap h3{font-family:'Bebas Neue',sans-serif;font-size:1rem;color:var(--pk);letter-spacing:.05em;margin-bottom:.15rem;}
.pl-sub{font-family:'Space Mono',monospace;font-size:.55rem;color:rgba(255,255,255,.28);margin-bottom:.9rem;}
.track{display:flex;align-items:center;gap:.85rem;padding:.62rem .55rem;border-radius:11px;cursor:pointer;transition:all .18s;border:1px solid transparent;}
.track:hover{background:rgba(255,255,255,.05);border-color:rgba(255,60,172,.25);}
.track.on{background:rgba(255,60,172,.1);border-color:rgba(255,60,172,.4);}
.t-n{font-family:'Space Mono',monospace;font-size:.55rem;color:#3a3a3a;min-width:14px;}
.t-art{width:35px;height:35px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:.95rem;flex-shrink:0;background:linear-gradient(135deg,#300010,#600030);}
.t-info{flex:1;}
.t-name{font-size:.81rem;font-weight:600;color:#fff;}
.t-artist{font-size:.67rem;color:#444;margin-top:.08rem;}
.t-dur{font-family:'Space Mono',monospace;font-size:.58rem;color:#2a2a2a;}
.eq{display:none;align-items:center;gap:2px;}
.track.on .eq{display:flex;}
.eq span{width:2.5px;border-radius:3px;background:var(--pk);animation:eqa .75s ease-in-out infinite alternate;}
.eq span:nth-child(1){height:6px;} .eq span:nth-child(2){height:12px;animation-delay:.15s;} .eq span:nth-child(3){height:8px;animation-delay:.3s;}
@keyframes eqa{to{height:2px;}}
.wild-wrap{margin-bottom:2.5rem;background:linear-gradient(135deg,#7C3AED,#2B86C5);border-radius:18px;padding:1.4rem 1.5rem;}
.wild-wrap h3{font-family:'Fraunces',serif;font-size:1.2rem;font-weight:900;color:#fff;margin-bottom:.5rem;}
.wild-kicker{font-family:'Space Mono',monospace;font-size:.55rem;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.6);margin-bottom:.6rem;}
.wild-wrap p{font-size:.84rem;line-height:1.7;color:rgba(255,255,255,.9);}
.footer{background:var(--ink);color:rgba(255,255,255,.4);text-align:center;padding:2.5rem 1.5rem 2rem;margin:0 -1.2rem;margin-top:1rem;}
.footer-logo{font-family:'Bebas Neue',sans-serif;font-size:1.8rem;color:var(--y);letter-spacing:.05em;}
.footer-sub{font-size:.75rem;margin:.4rem 0 1.4rem;font-style:italic;}
.footer-links{display:flex;justify-content:center;flex-wrap:wrap;gap:1.2rem;margin-bottom:1.2rem;}
.footer-links a{font-family:'Space Mono',monospace;font-size:.55rem;letter-spacing:.12em;color:rgba(255,255,255,.35);text-decoration:none;text-transform:uppercase;transition:color .18s;}
.footer-links a:hover{color:var(--y);}
.footer-copy{font-family:'Space Mono',monospace;font-size:.58rem;opacity:.25;}
.share-row{display:flex;justify-content:center;gap:.7rem;margin-bottom:1.4rem;}
.sh-btn{background:rgba(255,255,255,.07);color:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:.42rem .95rem;font-family:'Space Mono',monospace;font-size:.62rem;cursor:pointer;transition:background .18s;}
.sh-btn:hover{background:rgba(255,214,0,.12);color:var(--y);}
.reveal{opacity:0;transform:translateY(24px);transition:opacity .6s ease,transform .6s ease;}
.reveal.in{opacity:1;transform:translateY(0);}
#loading{position:fixed;inset:0;background:var(--ink);z-index:99999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1rem;}
#loading .spin{font-size:2.5rem;animation:spin 1.5s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
#loading p{font-family:'Space Mono',monospace;font-size:.7rem;color:var(--y);letter-spacing:.1em;}
#err{display:none;padding:2rem;text-align:center;color:var(--r);font-size:.85rem;line-height:1.6;}
@media(max-width:480px){.ent-grid,.p-facts{grid-template-columns:1fr 1fr;}.cover-title{font-size:3.5rem;}.nav-links{gap:.7rem;}}
</style>
</head>
<body>

function esc(s){return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

      <span>📅 ${esc(D.meta.date||'')}</span>
      <span>✍️ ${esc(D.meta.editor||'Chocolate')}</span>

      <div class="nc-bar" style="background:${c.bar}"></div>

    <div class="sci-top-band"><div class="sci-band-title">${esc(S.bandTitle||S.topic||'')}</div><div class="sci-band-tag">${esc(S.readTime||'~4 min read')}</div></div>

  (S.sections||[]).forEach(sec=>{
    html+=`<div class="sci-h3">${esc(sec.h)}</div><div class="sci-p">${sec.pHTML||esc(sec.p)}</div>`;

    html+=`<div class="vocab-box"><h4>📖 Vocab to Know</h4>`;

  /* PERSONALITY */
  const P=D.personality||{};
  html+=`<section id="personality" style="padding:2.2rem 0 0;"><div class="sec-header reveal">
    <div class="sec-kicker" style="color:#FF3CAC">⭐ inspiration for curious minds</div>
    <div class="sec-title">PERSONALITY OF THE WEEK</div>
    <div class="sec-sub">One person. Their full story. What you can learn from them.</div>
  </div><div class="pers-wrap reveal">

    <div class="pers-body">
      <div class="p-avatar">${esc(P.avatar||'⭐')}</div>
      <div class="p-name">${esc(P.name)}</div>

  }

      <div class="j-setup" id="jsetup">${esc(F.jokes[0].setup)}</div>
      <div class="j-punch" id="jpunch">${esc(F.jokes[0].punch)}</div>
      <button class="j-btn" onclick="revealJ()">🥁 Punchline!</button>

/* CURSOR */
const cur=document.getElementById('cur');
document.addEventListener('mousemove',e=>{cur.style.left=e.clientX+'px';cur.style.top=e.clientY+'px';});
document.addEventListener('mouseover',e=>{if(e.target.closest('a,button,.nc,.ec,.track,.qo,.ff'))cur.classList.add('big');else cur.classList.remove('big');});

/* PROGRESS + BTT */
window.addEventListener('scroll',()=>{
  const pct=window.scrollY/(document.body.scrollHeight-window.innerHeight)*100;
  document.getElementById('prog').style.width=pct+'%';
  document.getElementById('btt').classList.toggle('show',window.scrollY>500);
});

/* REVEAL */
function initReveal(){
  const obs=new IntersectionObserver(e=>{e.forEach(x=>{if(x.isIntersecting)x.target.classList.add('in');});},{threshold:.1});
  document.querySelectorAll('.reveal').forEach(el=>obs.observe(el));
}

/* QUIZ */
let QS=[],qi=0,sc=0,qa=false;
function initQuiz(qs){QS=qs;qi=0;sc=0;if(QS.length)loadQ();}
function loadQ(){
  const q=QS[qi];
  document.getElementById('qtxt').textContent=q.q;
  document.getElementById('qctr').textContent=`Question ${qi+1} of ${QS.length}`;
  document.getElementById('qpb').style.width=((qi+1)/QS.length*100)+'%';
  document.getElementById('qfb').textContent='';
  document.getElementById('qnb').style.display='none';
  qa=false;
  const el=document.getElementById('qopts');el.innerHTML='';
  q.opts.forEach((o,i)=>{const b=document.createElement('button');b.className='qo';b.textContent=o;b.onclick=()=>ansQ(i,b);el.appendChild(b);});
}
function ansQ(i,b){
  if(qa)return;qa=true;const q=QS[qi],fb=document.getElementById('qfb');
  document.querySelectorAll('.qo').forEach(x=>x.disabled=true);
  if(i===q.a){b.classList.add('correct');sc++;fb.textContent='✅ '+q.exp;fb.style.color='#00C896';}
  else{b.classList.add('wrong');document.querySelectorAll('.qo')[q.a].classList.add('correct');fb.textContent='❌ '+q.exp;fb.style.color='#FF6B6B';}
  document.getElementById('qnb').style.display='inline-block';
}
function nextQ(){qi++;if(qi>=QS.length){showScore();return;}loadQ();}
function showScore(){
  ['qopts','qtxt','qctr'].forEach(id=>document.getElementById(id).style.display='none');
  document.querySelector('.q-prog').style.display='none';
  document.getElementById('qfb').style.display='none';document.getElementById('qnb').style.display='none';
  document.getElementById('qdone').style.display='block';
  document.getElementById('qsb').textContent=sc+'/'+QS.length;
  const m=['Re-read the issue! 📰','Getting there! 💪','Nice work! 🌟','Sharp! ⚡','PERFECT! 🏆'];
  document.getElementById('qsm').textContent=m[sc]||m[m.length-1];
}
function restartQ(){
  qi=0;sc=0;['qopts','qtxt','qctr'].forEach(id=>document.getElementById(id).style.display='');
  document.querySelector('.q-prog').style.display='block';document.getElementById('qfb').style.display='block';
  document.getElementById('qdone').style.display='none';loadQ();
}

/* PLAYLIST */
let np=-1;
function initPlaylist(tks){
  const tel=document.getElementById('tracks');if(!tel)return;tel.innerHTML='';
  tks.forEach((t,i)=>{
    tel.innerHTML+=`<div class="track" id="tr${i}" onclick="playT(${i})">
      <span class="t-n">${i+1}</span><div class="t-art">${esc(t.emoji||'🎵')}</div>
      <div class="t-info"><div class="t-name">${esc(t.name)}</div><div class="t-artist">${esc(t.artist)}</div></div>
      <div class="eq"><span></span><span></span><span></span></div>
      <div class="t-dur">${esc(t.duration||'')}</div></div>`;
  });
}
function playT(i){document.querySelectorAll('.track').forEach(t=>t.classList.remove('on'));if(np===i){np=-1;return;}document.getElementById('tr'+i).classList.add('on');np=i;}

/* JOKES */
let JK=[],ji=0;
function initJokes(j){JK=j;ji=0;}
function revealJ(){document.getElementById('jpunch').style.display='block';}
function nextJ(){if(!JK.length)return;ji=(ji+1)%JK.length;document.getElementById('jsetup').textContent=JK[ji].setup;document.getElementById('jpunch').textContent=JK[ji].punch;document.getElementById('jpunch').style.display='none';}
